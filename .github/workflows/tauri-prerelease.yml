name: Tauri Prerelease

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: tauri-prerelease-main
  cancel-in-progress: false

jobs:
  windows-prerelease:
    name: Build Windows prerelease
    runs-on: windows-latest

    env:
      RELEASE_VERSION: 0.1.${{ github.run_number }}
      RELEASE_TAG: v0.1.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Set prerelease version
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $package.version = $env:RELEASE_VERSION
          $package | ConvertTo-Json -Depth 100 | Set-Content package.json -Encoding UTF8

          $tauriConfig = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $tauriConfig.version = $env:RELEASE_VERSION
          $tauriConfig | ConvertTo-Json -Depth 100 | Set-Content src-tauri/tauri.conf.json -Encoding UTF8

          $cargoToml = Get-Content src-tauri/Cargo.toml -Raw
          $cargoToml = $cargoToml -replace '(?m)^version = ".*"$', "version = `"$env:RELEASE_VERSION`""
          Set-Content src-tauri/Cargo.toml -Value $cargoToml -Encoding UTF8

      - name: Build Tauri app
        run: npm run tauri:build

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Web Auto Mapping ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
